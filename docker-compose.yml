version: '3.8'

services:

  # ─── MySQL Database ───────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: taskzen_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: task_db
      MYSQL_USER: ${DB_USER:-taskzen}
      MYSQL_PASSWORD: ${DB_PASSWORD:-taskzenpass}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database_schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Node.js Backend ──────────────────────────────────────────────
  backend:
    build:
      context: ./Server
      dockerfile: Dockerfile
    container_name: taskzen_backend
    restart: unless-stopped
    environment:
      PORT: 5000
      DB_HOST: db
      DB_USER: ${DB_USER:-taskzen}
      DB_PASSWORD: ${DB_PASSWORD:-taskzenpass}
      DB_NAME: task_db
      JWT_SECRET: ${JWT_SECRET:-your_super_secret_jwt_key_change_this}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  # ─── React Frontend ───────────────────────────────────────────────
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: taskzen_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
